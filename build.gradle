plugins {
    id 'java-library'
    id 'idea'
}

group = mod_group_id
version = mod_version

subprojects {
    repositories {
        mavenCentral()
    }

    java {
        toolchain.languageVersion.set(JavaLanguageVersion.of(java_version))
    }

    // The sources are UTF-8. Without this, javac falls back to the platform default charset, which
    // on a Chinese Windows is GBK: comments come out mangled and every non-ASCII string literal -
    // the gear and sort buttons on the EndInv panel among them - is compiled as garbage.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    // MixinGradle's annotation processor writes the mixin refmap and its mapping tsrg into
    // build/tmp, and Gradle's build cache does not carry them: only the classes directory is
    // cached, so a compileJava restored from the cache comes back without either file. The mixin
    // jar is then assembled with no refmap at all, and it fails at run time in a way that looks
    // nothing like a build problem - every @Shadow keeps its source name and every injection
    // target stays un-remapped. Keeping this task out of the cache makes the processor run every
    // time. Incremental compilation is unaffected; only the cross-build cache is given up.
    tasks.withType(JavaCompile).configureEach {
        outputs.cacheIf { false }
    }

    base {
        archivesName = "${mod_name}-${minecraft_version}-${mod_version}-${project.name}"
    }

    // IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }

    repositories {
        mavenCentral()
        // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = 'https://repo.spongepowered.org/repository/maven-public'
                }
            }
            filter { includeGroup('org.spongepowered') }
        }
        exclusiveContent {
            forRepositories(
                    maven {
                        name = 'ParchmentMC'
                        url = 'https://maven.parchmentmc.org/'
                    },
                    maven {
                        name = "NeoForge"
                        url = 'https://maven.neoforged.net/releases'
                    }
            )
            filter { includeGroup('org.parchmentmc.data') }
        }
        maven {
            name = 'BlameJared'
            url = 'https://maven.blamejared.com'
        }
    }

}

