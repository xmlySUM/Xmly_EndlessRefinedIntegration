modLoader="javafml"
loaderVersion="${forge_version_range}"

license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"

displayName="${mod_name}"

authors="${mod_authors}"

description='''
Integration between Endless Inventory and Refined Storage.

Provides:
- a Refined Storage portable grid with no disk, backed by Endless Inventory
- Endless Inventory as an extension of the player inventory
- items that fit nowhere kept instead of dropped on the ground
- item NBT preserved on its way to the client
- a multi-group hotbar with Endless Inventory pages, an ender chest swap and a nine by
  nine panel, forked from QuadHotbar (LGPL-3.0, see THIRD-PARTY.md)

NOT COMPATIBLE with the standalone QuadHotbar mod: both patch the same instruction, so
only one may be installed.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="endless_inventory"
mandatory=true
versionRange="[1.1.0,1.2)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="refinedstorage"
mandatory=false
versionRange="[1.12.0,1.13)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="[15.20,16)"
ordering="AFTER"
side="BOTH"

# No entry for quadhotbar: Forge's mods.toml cannot express a conflict, and an
# optional dependency would wrongly read as "these two work together". They cannot
# both patch Inventory#getSelectionSize inside handleSetCarriedItem, so HotbarEngine
# refuses to load when the standalone mod is present.
